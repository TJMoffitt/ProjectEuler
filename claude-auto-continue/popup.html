<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #faf9f5; color: #1f1e1d; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; margin-bottom: 10px; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
    #start { background: #d97757; color: #fff; }
    #stop { background: #e5e3dc; color: #1f1e1d; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 12px; min-height: 1.2em; color: #555; }
  </style>
</head>
<body>
  <h1>Claude Auto-Continue</h1>
  <label>Number of times
    <input id="max" type="number" min="1" value="5">
  </label>
  <label>Message
    <input id="message" type="text" value="continue">
  </label>
  <label>Wait after Claude finishes (seconds)
    <input id="delay" type="number" min="0" step="0.5" value="3">
  </label>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status">Idle</div>
  <script src="popup.js"></script>
</body>
</html>
